
name: Control de calidad

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: json2csv

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar proyecto y herramientas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check src tests

      - name: Black
        run: python -m black --check src tests

      - name: MyPy
        run: python -m mypy src/json2csv

      - name: Pyright
        run: python -m pyright src/json2csv

      - name: Pruebas y cobertura
        run: python -m pytest tests/test_json2csv.py --cov=json2csv --cov-report=term-missing

      - name: Bandit
        run: python -m bandit -r src/json2csv
