[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json2csv"
version = "0.1.0"
description = "Herramienta en Python para convertir archivos JSON a CSV"
readme = "README.md"
authors = [
  {name = "Matias Baissetto", email = "matiasbaissetto@gmail.com"}
]
maintainers = [
  {name = "Matias Baissetto", email = "matiasbaissetto@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "security" },
]

lint = [
    "ruff",
    "black",
]

test = [
    "pytest",
    "pytest-cov",
    "coverage",
]

typecheck = [
    "mypy",
    "pyright",
]

security = [
    "bandit",
]

docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/matibaissetto/json2csv/issues"
changelog = "https://github.com/matibaissetto/json2csv/releases"
documentation = "https://matibaissetto.github.io/json2csv/"
homepage = "https://github.com/matibaissetto/json2csv"

[project.scripts]
json2csv = "json2csv.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/json2csv"]

[tool.uv]
package = true
default-groups = ["dev"]
